name: Deploy AI Generation Library

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Apply actual Pages URL
        env:
          PAGES_BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import YAML from 'yaml';
          const config = YAML.parse(fs.readFileSync('quartz.config.yaml', 'utf8'));
          config.configuration.baseUrl = process.env.PAGES_BASE_URL.replace(/^https?:\/\//, '').replace(/\/$/, '');
          fs.writeFileSync('quartz.config.yaml', YAML.stringify(config));
          NODE
      - name: Build book library
        run: npm run build
      - name: Validate generated books and links
        run: python scripts/check-output.py --base-path /books/
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
